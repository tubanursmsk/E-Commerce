<div class="container py-5">
  
  <div class="text-center mb-5">
    <h2 class="fw-bold">Kategoriler</h2>
    <p class="text-muted">İhtiyacınız olan teknolojiye hızlıca ulaşın.</p>
  </div>

  @if (loading) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  } @else {
    <div class="row g-4 justify-content-center">
      @for (category of categories; track category.id; let i = $index) {
        <div class="col-6 col-md-4 col-lg-3">
          <a [routerLink]="['/products']" [queryParams]="{ categoryId: category.id }" 
             class="card h-100 border-0 shadow-sm category-card text-decoration-none text-dark text-center overflow-hidden">
            
            <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
              
              <div class="icon-circle mb-3 d-flex align-items-center justify-content-center"
                   [ngClass]="getCategoryColor(i) + '-subtle'">
                <i class="bi fs-1" 
                   [class]="getCategoryIcon(category.name)"
                   [class.text-primary]="i % 6 === 0"
                   [class.text-success]="i % 6 === 1"
                   [class.text-warning]="i % 6 === 2"
                   [class.text-info]="i % 6 === 3"
                   [class.text-danger]="i % 6 === 4"
                   [class.text-secondary]="i % 6 === 5">
                </i>
              </div>

              <h5 class="card-title fw-bold mb-1">{{ category.name }}</h5>
              <small class="text-muted">Ürünleri İncele <i class="bi bi-arrow-right ms-1"></i></small>
            </div>
            
            <div class="card-footer p-0 border-0 bg-primary category-line"></div>
          </a>
        </div>
      }
    </div>
  }
</div>
