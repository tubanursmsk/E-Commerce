<div class="container d-flex flex-column justify-content-center align-items-center min-vh-75 py-5">
  
  <div class="position-relative mb-4">
    <div class="icon-bg rounded-circle bg-light d-flex align-items-center justify-content-center">
      <i class="bi bi-box-seam display-1 text-primary opacity-50 floating-icon"></i>
    </div>
    <div class="position-absolute top-0 end-0">
      <i class="bi bi-exclamation-circle-fill text-warning fs-1 bg-white rounded-circle"></i>
    </div>
  </div>

  <div class="text-center" style="max-width: 600px;">
    <h1 class="fw-bold display-4 mb-2">Oops! Sayfa Bulunamadı</h1>
    <p class="text-muted lead mb-4">
      Aradığınız ürün stoklarımızda tükenmiş, silinmiş veya sayfanın adı değiştirilmiş olabilir.
    </p>

    <div class="search-wrapper shadow-sm rounded-pill border p-1 mb-4 mx-auto bg-white d-flex align-items-center" style="max-width: 400px;">
      <i class="bi bi-search ms-3 text-muted"></i>
      <input type="text" 
             [(ngModel)]="searchKeyword" 
             (keyup.enter)="onSearch()"
             class="form-control border-0 shadow-none bg-transparent" 
             placeholder="Belki arayarak bulabilirsiniz...">
      <button (click)="onSearch()" class="btn btn-primary rounded-pill px-4">Ara</button>
    </div>

    <div class="d-flex gap-3 justify-content-center">
      <a routerLink="/" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
        <i class="bi bi-house me-2"></i>Ana Sayfa
      </a>
      <a routerLink="/products" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm btn-hover-effect">
        <i class="bi bi-bag me-2"></i>Alışverişe Devam Et
      </a>
    </div>
  </div>

</div>
