
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 p-4">
        <div class="text-center mb-4">
          <h3 class="fw-bold">Giriş Yap</h3>
          <p class="text-muted small">Alışverişe devam etmek için giriş yapın.</p>
        </div>

        <form (ngSubmit)="onLogin()">
          <div class="mb-3">
            <label class="form-label fw-medium">E-Posta Adresi</label>
            <input type="email" [(ngModel)]="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="ornek@email.com" required>
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-medium">Şifre</label>
            <input type="password" [(ngModel)]="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="******" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold shadow-sm mb-3">
            Giriş Yap
          </button>
          
          <div class="text-center small">
            Hesabınız yok mu? <a routerLink="/register" class="text-primary fw-bold text-decoration-none">Hemen Üye Ol</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
