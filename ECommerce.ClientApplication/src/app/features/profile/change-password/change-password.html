<div class="container py-5">
  <div class="row">
    
    <div class="col-lg-3 mb-4">
      <div class="list-group list-group-flush border-0">
        <a routerLink="/profile" class="list-group-item list-group-item-action active fw-bold border-0 rounded-3 mb-1">
          Üyelik Bilgilerim
        </a>
        <a routerLink="/orders" class="list-group-item list-group-item-action border-0 rounded-3 mb-1">
          Siparişlerim
        </a>
        <a routerLink="/favorites" class="list-group-item list-group-item-action border-0 rounded-3 mb-1">
          Favorilerim
        </a>
        <a routerLink="/messages" class="list-group-item list-group-item-action border-0 rounded-3 mb-1">
          Mesajlarım
        </a>
        <a routerLink="/change-password" class="list-group-item list-group-item-action border-0 rounded-3 mb-1">
          Şifre Değiştirme
        </a>
        <button (click)="onLogout()" class="list-group-item list-group-item-action border-0 rounded-3 mb-1 text-danger fw-bold">
          Çıkış Yap <i class="bi bi-box-arrow-right ms-2"></i>
        </button>
      </div>
    </div>

    <div class="col-lg-9">
      <h3 class="fw-bold mb-4">Şifre Değiştirme</h3>
      <p class="text-muted small mb-4">
        Hesap güvenliğiniz için güçlü bir şifre kullanmanızı öneririz.
      </p>

      <div class="card border-0 p-4 shadow-sm rounded-4">
        <form (ngSubmit)="onSubmit()">
          
          <div class="row g-4">
            <div class="col-12">
              <label class="form-label fw-bold small text-muted">Mevcut Şifre</label>
              <input type="password" [(ngModel)]="passwordData.currentPassword" name="currentPassword" class="form-control form-control-lg bg-light border-0" placeholder="********">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Yeni Şifre</label>
              <input type="password" [(ngModel)]="passwordData.newPassword" name="newPassword" class="form-control form-control-lg bg-light border-0" placeholder="En az 6 karakter">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-muted">Yeni Şifre (Tekrar)</label>
              <input type="password" [(ngModel)]="passwordData.confirmPassword" name="confirmPassword" class="form-control form-control-lg bg-light border-0" placeholder="Şifrenizi tekrar girin">
            </div>

            <div class="col-12 mt-4 text-end">
              <button type="submit" class="btn btn-primary-dark px-5 py-3 rounded-3 fw-bold">
                Şifreyi Güncelle
              </button>
            </div>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
